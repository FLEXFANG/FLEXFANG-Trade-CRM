name: FLEXFANG Trade CRM CI

on:
  push:
    branches:
      - feature/trade-crm-v0.1
  pull_request:
    branches:
      - master-jdk17

jobs:
  backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate Trade CRM permission contract
        run: python scripts/check-trade-permissions.py
      - name: Enable CRM dependency chain for isolated CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pom.xml')
          text = p.read_text(encoding='utf-8')
          markers = [
              ('<!--        <module>yudao-module-bpm</module>-->', '        <module>yudao-module-bpm</module>'),
              ('<!--        <module>yudao-module-crm</module>-->', '        <module>yudao-module-crm</module>'),
          ]
          for marker, replacement in markers:
              if marker not in text: raise SystemExit(f'Module marker not found: {marker}')
              text = text.replace(marker, replacement, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Run Trade CRM domain tests
        run: mvn -B -pl yudao-module-crm -am -Dtest=CrmTradeProfileServiceImplTest,CrmTradeProfileSaveReqVOTest,CrmClueTradeProfileTransformTest,CrmTradeRfqServiceImplTest,CrmTradeRfqSaveReqVOTest,CrmTradeSampleServiceImplTest,CrmTradeSampleSaveReqVOTest,CrmTradeQuotationServiceImplTest,CrmTradeQuotationSaveReqVOTest -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Package CRM and dependencies
        run: mvn -B -pl yudao-module-crm -am -DskipTests package
