name: FLEXFANG Trade CRM CI

on:
  push:
    branches:
      - feature/trade-crm-v0.1
  pull_request:
    branches:
      - master-jdk17

jobs:
  backend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Enable CRM module for isolated CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('pom.xml')
          text = p.read_text(encoding='utf-8')
          marker = '<!--        <module>yudao-module-crm</module>-->'
          if marker not in text:
              raise SystemExit('CRM module marker not found in root pom.xml')
          p.write_text(text.replace(marker, '        <module>yudao-module-crm</module>', 1), encoding='utf-8')
          PY

      - name: Compile CRM and dependencies
        run: mvn -B -pl yudao-module-crm -am -DskipTests package
