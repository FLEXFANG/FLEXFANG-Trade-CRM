name: FLEXFANG Trade CRM UI CI

on:
  push:
    branches:
      - feature/trade-crm-v0.1
  pull_request:
    branches:
      - master-jdk17

jobs:
  ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Trade CRM overlay
        uses: actions/checkout@v4

      - name: Checkout pinned Yudao Vue3 frontend
        uses: actions/checkout@v4
        with:
          repository: yudaocode/yudao-ui-admin-vue3
          ref: a58e6de223b616b9dc14c95551d9d10faf5a280b
          path: .ui-upstream

      - name: Apply FLEXFANG overlay
        run: |
          rsync -a frontend/yudao-ui-admin-vue3-overlay/ .ui-upstream/
          test -f .ui-upstream/src/api/crm/trade/index.ts
          test -f .ui-upstream/src/views/crm/trade/workbench/index.vue
          test -f .ui-upstream/src/views/crm/trade/customer/index.vue

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: .ui-upstream/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: .ui-upstream
        run: pnpm install --frozen-lockfile

      - name: Type-check FLEXFANG UI in upstream project
        working-directory: .ui-upstream
        run: pnpm ts:check

      - name: Build frontend
        working-directory: .ui-upstream
        run: pnpm build:dev
